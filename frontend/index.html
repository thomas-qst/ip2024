<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>Fotoalbum</title>
    <link rel="stylesheet" href="style/index.css">
    <script type="module" src="src/js/index.js"></script>
</head>
<body>
<div class="custom-infinitscroll">
    <div class="custom-container">
    </div>
</div>

<div class="container col-xl-10 col-xxl-8 px-4 py-5">
    <div class="row align-items-center g-lg-5 py-5">
        <div class="d-flex justify-content-center container">
            <div class="row">
                <div class="col-lg-4">
                    <img alt="Logo" src="Logo2.png" height="250" width="250"/>
                    <title>Logo</title>
                </div>
            </div>
        </div>
        <div class="col-md-10 mx-auto col-lg-5">
            <form id="login" class="p-4 p-md-5 border rounded-3 bg-body-tertiary needs-validation" novalidate>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="username" required>
                    <label for="username">username</label>
                    <div class="invalid-feedback">Benutzername oder Passwort sind falsch!</div>
                </div>
                <div class="form-floating mb-3">
                    <div class="form-floating d-flex flex-row">
                        <input type="password" class="form-control" id="password" placeholder="password" required>
                        <label for="password">password</label>
                        <button id="showPassword" class="input-group-text" type="button">
                            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-fill" viewBox="0 0 16 16">
                                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                                <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                            </svg>
                            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash-fill d-none" viewBox="0 0 16 16">
                                <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"/>
                                <path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"/>
                            </svg>
                        </button>
                    </div>

                </div>
                <button class="w-100 btn btn-lg btn-info" type="submit">Anmelden</button>
            </form>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
