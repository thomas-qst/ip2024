<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Fotoalbum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="src/js/sharedFunctions.js"></script>
    <script src="src/js/fotos.js"></script>
</head>
<body class="overflow-hidden">
<header class="border-bottom data-bs-theme=”dark" style="height: 4rem;">
    <div class="container h-100">
        <div class="d-inline-block align-middle position-relative" style="top: 10%">
            <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decorattion-none">
                <img alt="Logo" src="Logo2.png" height="50" width="50"/>
            </a>
        </div>
        <div class="d-inline-block align-middle position-relative align-" style="top: 20%">
            <div class="d-flex flex-wrap align-items-center justify-content-end justify-content-lg-end">
                <form class="col-13 col-lg-auto mb-3 mb-lg-0 me-lg-3" id="searchForm" role="search" style="width: 60vw; padding-left: 15vw;">
                    <input type="search" id="search" class="form-control" placeholder="Search..." aria-label="Search">
                </form>
                <a id="user" href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <!-- HIER NUTZERNAME -->
                </a>
                <div class="dropdown" data-bs-theme="dark">
                    <ul class="dropdown-menu text-small" aria-labelledby="dropdownMenuButtonDark" style="position: absolute; inset: 0px auto auto 0px; margin: 0px; transform: translate3d(-41.5px, 34px, 0px);" data-popper-placement="bottom-start">
                        <li>
                            <a class="dropdown-item d-none" id="UserManagement" href="#" data-bs-toggle="modal" data-bs-target="#userManagement-modal">User management</a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="/index.html" id="logout">Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

    </div>
</header>
<div class="d-flex flex-row" style="height: 100vh">
    <div class="d-flex flex-column flex-shrink-0 ps-3 text-bg-dark border-end" style="width: 10rem;">
        <ul class="nav nav-pills flex-column mb-auto mt-3">
            <li class="nav-item">
                <a href="#" class="nav-link active" aria-current="page">
                    <svg class="bi pe-none me-2" width="16" height="16">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-images" viewBox="0 0 16 16">
                            <path d="M4.502 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"/>
                            <path d="M14.002 13a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2V5A2 2 0 0 1 2 3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-1.998 2M14 2H4a1 1 0 0 0-1 1h9.002a2 2 0 0 1 2 2v7A1 1 0 0 0 15 11V3a1 1 0 0 0-1-1M2.002 4a1 1 0 0 0-1 1v8l2.646-2.354a.5.5 0 0 1 .63-.062l2.66 1.773 3.71-3.71a.5.5 0 0 1 .577-.094l1.777 1.947V5a1 1 0 0 0-1-1z"/>
                        </svg>
                    </svg>
                    Photos
                </a>
            </li>
            <li class="nav-item">
                <a href="alben.html" class="nav-link text-white" aria-current="page">
                    <svg class="bi pe-none me-2" width="16" height="16">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-folder2" viewBox="0 0 16 16">
                            <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5V6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3zM14 7H2v5.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5z"/>
                        </svg>
                    </svg>
                    Albums
                </a>
            </li>
        </ul>
    </div>
    <main id="main">
        <div id="imageContainer" class="d-flex flex-row flex-wrap">
            <div id="BlankImageDiv" class="d-none p-3">
                <div class="btn-group position-absolute" aria-label="Basic checkbox toggle button group">
                    <input type="checkbox" class="btn-check" autocomplete="off" id="BlankImageCheckbox">
                    <label class="btn btn-outline-primary position-absolute d-none" for="BlankImageCheckbox"></label>
                </div>
                <img class="z-n1" id="BlankImage" data-bs-toggle="modal" data-bs-target="#image-modal" alt="" src="">
                <div class="d-none position-relative opacity-75 bg-secondary-subtle" style="top: -18%" id="BlankImageMetadata">
                    <div></div>
                    <div></div>
                    <div class="d-none"></div>
                </div>
            </div>
        </div>
        <div class="position-fixed" style="right: 3rem;bottom: 3rem">
            <a class="btn btn-primary" data-bs-toggle="dropdown" aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                </svg>
            </a>
            <div class="dropdown" data-bs-theme="dark">
                <ul class="dropdown-menu text-small" aria-labelledby="dropdownMenuButtonDark" style="position: absolute; inset: 0px auto auto 0px; margin: 0px; transform: translate3d(-41.5px, 34px, 0px);" data-popper-placement="bottom-start">
                    <li>
                        <button id="upload" class="dropdown-item" data-bs-toggle="modal" data-bs-target="#upload-modal">Upload</button>
                    </li>
                </ul>
            </div>
        </div>
        <div class="d-none position-fixed border bg-dark-subtle" id="selectedDiv" style="bottom: 0;height: 3rem;width: 100%">
            <button type="button" id="addToAlbum" class="btn btn-primary mx-2 my-1" data-bs-toggle="modal" data-bs-target="#addToAlbum-modal" >Add to Album</button>
            <button type="button" id="deleteMultiple" class="btn btn-danger mx-2 my-1">Delete</button>
            <button type="button" id="cancelSelect" class="btn btn-secondary mx-2 my-1">Cancel</button>
        </div>
    </main>
</div>

<div class="modal fade" tabindex="-1" id="upload-modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Image Upload</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
            </div>
            <div class="modal-body" id="upload-modal-body">
                <p> Select the picture or use drag and drop</p>
                <input class="input-control" id="upload-modal-input" type="file" accept=".jpg,.jpeg,.png"/>
                <div id="upload-modal-dropcontainer" class="border-primary mt-3 flex-column d-flex align-items-center justify-content-center" style="border: dashed;height: 20rem;width: 20rem">
                    <p>Upload via drag and drop</p>
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-cloud-arrow-up-fill" viewBox="0 0 16 16">
                        <path d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2m2.354 5.146a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2a.5.5 0 0 1 .708 0z"/>
                    </svg>
                </div>
                <div id="upload-modal-error" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                    <button id="upload-modal-error-button" type="button" class="btn-close"></button>
                </div>
                <form class="form-floating">
                    <input id="upload-modal-title" type="text" placeholder="Titel" class="form-control d-inline my-2" style="width: 80%"/>
                    <label for="upload-modal-title">Titel</label>
                </form>
                <form class="form-floating">
                    <input id="upload-modal-tags" type="text" placeholder="Tags" class="form-control d-inline my-2" style="width: 80%"/>
                    <label for="upload-modal-tags">Tags (Separate with a whitespace)</label>
                </form>
            </div>
            <div class="modal-footer">
                <button id="upload-modal-close" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button id="upload-modal-submit" type="button" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" tabindex="-1" id="image-modal">
    <div class="modal-dialog modal-fullscreen">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Image</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
            </div>
            <div class="modal-body" id="image-modal-body">
                <img id="image-modal-image" alt="" src="">
                <div id="image-modal-title"><h3>Title</h3></div>
                <div id="image-modal-date"><h3>Date</h3></div>
                <div id="image-modal-tags"><h3>Tags</h3></div>
            </div>
            <div class="modal-footer">
                <button id="image-modal-delete" type="button" class="btn btn-danger">Delete</button>
                <button id="image-modal-edit" type="button" class="btn btn-secondary">Edit</button>
                <button id="image-modal-download" type="button" class="btn btn-secondary">Download</button>
                <button id="image-modal-close" type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" tabindex="-1" id="addToAlbum-modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Add Images to Album</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
            </div>
            <div class="modal-body" id="addToAlbum-modal-body">
                <div id="addToAlbum-modal-blankAlbumElement" class="d-none border d-flex flex-row align-items-center justify-content-between">
                    <input type="checkbox" class="btn-check" autocomplete="off" id="addToAlbum-modal-checkbox">
                    <label class="btn btn-outline-primary my-3 mx-2" for="addToAlbum-modal-checkbox"></label>
                    <p class="m-0"> Title </p>
                    <p class="m-0"> Date </p>
                </div>
            </div>
            <div class="modal-footer">
                <button id="addToAlbum-modal-close" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button id="addToAlbum-modal-submit" type="button" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" tabindex="-1" id="userManagement-modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">User Management</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
            </div>
            <div class="modal-body">
                <form id="userManagement-modal-addUserForm">
                    <div class="form-floating">
                        <input id="userManagement-modal-addUserForm-Username" placeholder="Username" type="text" class="form-control d-inline my-2">
                        <label for="userManagement-modal-addUserForm-Username">Username</label>
                    </div>
                    <div class="form-floating">
                        <input id="userManagement-modal-addUserForm-Password" placeholder="One Time Password" type="password" class="form-control d-inline my-2">
                        <label for="userManagement-modal-addUserForm-Password">One Time Password</label>
                    </div>
                    <button class="btn btn-success my-2" type="submit">Add User</button>
                </form>
                <div id="userManagement-modal-BlankUser" class="border container text-center d-none">
                    <div class="row">
                        <p class="my-0 mx-2 col align-content-center"></p>
                        <p class="my-0 mx-2 col align-content-center">User</p>
                        <button id="userManagement-modal-BlankDelete" class="btn btn-danger m-2 col">Delete User</button>
                    </div>

                </div>
            </div>
            <div class="modal-footer">
                <button id="userManagement-modal-close" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
